</style></head><body><div class="shell"><div class="brand"><span class="brand-mark">✣</span><span>RBI Prep OS</span></div><header class="topbar"><button class="icon-btn mobile-menu" id="menuBtn" aria-label="Open menu">☰</button><input class="search" id="search" placeholder="⌕  Search tasks and notes" aria-label="Search tasks and notes"/><button class="export" id="exportBtn">⇧ Export summary ▾</button><button class="icon-btn" id="clockBtn" title="Focus timer">◷</button><button class="icon-btn" id="notifyBtn" title="Due tasks">♧</button><div class="avatar">📚</div></header><aside class="sidebar" id="sidebar"><div class="side-card" id="navigation"><button class="nav-item active" data-page="Dashboard"><span class="symbol">⬟</span>Dashboard</button><button class="nav-item" data-page="List"><span class="symbol">☑</span>Study list</button><button class="nav-item" data-page="Calendar"><span class="symbol">▦</span>Calendar</button><button class="nav-item" data-page="Notes"><span class="symbol">▤</span>Notes vault</button></div><div class="side-heading">My subjects <button style="border:0;background:none" id="addSubject" title="Add subject">＋</button></div><div class="side-card" id="subjectList"></div><div class="side-heading">Workspace <span>＋</span></div><div class="side-card"><div class="list-item">🌿 Revision center</div><div class="list-item">✦ AI tutor (later)</div></div><div style="flex:1"></div><div class="side-card"><button class="nav-item" id="settingsBtn"><span class="symbol">⚙</span>Settings & Backup</button></div></aside><main class="main" id="dashboard"><section class="hero"><h1 id="greeting">Good Morning!</h1><p id="taskCount">Your study plan for today</p><div class="hills"></div><div class="tree one"></div><div class="tree two"></div><div class="upnext"><strong>Up next</strong><div class="meeting">Study your next RBI topic<small>Open your Anuj Jindal lesson</small></div><div class="meeting second">Capture notes and screenshots<small>Track what you actually learn</small></div></div></section><section class="panel calendar-panel"><div class="calendar-head"><button class="cal-arrow" id="prevMonth">‹</button><div class="cal-title" id="monthTitle"></div><button class="cal-arrow" id="nextMonth">›</button></div><div class="calendar-grid" id="calendar"></div></section><div class="left-stack"><section class="panel"><div class="add-task"><input id="taskInput" placeholder="＋  Add study task for today"/><button id="addTaskBtn" aria-label="Add task">➤</button></div><div class="chips"><button class="chip selected" data-subject="Finance">Finance</button><button class="chip" data-subject="Management">Management</button><button class="chip" data-subject="ESI">ESI</button><button class="chip" data-subject="Quant">Quant</button></div></section><section><h2 class="section-title">Today's study tasks</h2><div class="panel tasks" id="taskList"></div></section></div><div class="right-stack"><section class="timer"><h2>Focus timer</h2><p><select class="subject-picker" id="timerSubject" aria-label="Timer subject"></select></p><div class="timer-controls"><button class="round" id="minusTime">−</button><div class="timer-time" id="timerDisplay">30:00</div><button class="round" id="plusTime">+</button></div><button class="start" id="startTimer">▶ Start</button><div class="timer-footer" id="timerStatus">Ready to focus</div><div class="forest"></div></section></div></main><main class="main hidden" id="otherPage"><section class="panel workspace"><h1 class="page-heading" id="otherTitle"></h1><div id="otherContent"></div></section></main></div><div class="notice hidden" id="toast"></div><script>
const KEY='rbi-prep-os-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}state=state||{subjects:['Finance','Management','ESI','Quant','Reasoning','English','Current Affairs'],tasks:[],notes:[],sessions:[]};let selectedSubject='Finance',month=new Date(),activePage='Dashboard',timerMinutes=30,timerRemaining=1800,timerRunning=false,timerEnd=0,timerInterval=null,timerStarted=0;const $=id=>document.getElementById(id),save=()=>localStorage.setItem(KEY,JSON.stringify(state)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dateKey=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10),today=dateKey(new Date());function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2600)}function renderSubjects(){$('subjectList').innerHTML=state.subjects.map((s,i)=>`<div class="list-item" data-subject-index="${i}"><span>▧</span>${esc(s)}<span class="dot" style="background:${['#6c9eec','#91d59b','#e5c85c','#f7a28a'][i%4]}"></span></div>`).join('');$('timerSubject').innerHTML=state.subjects.map(s=>`<option ${s===selectedSubject?'selected':''}>${esc(s)}</option>`).join('')}function renderTasks(){let tasks=state.tasks.filter(t=>t.date===today);$('taskCount').textContent=`You have ${tasks.filter(t=>!t.done).length} study tasks for today`;$('taskList').innerHTML=tasks.length?tasks.map(t=>`<div class="task"><input type="checkbox" data-task-id="${t.id}" ${t.done?'checked':''}/><div class="task-name ${t.done?'done':''}">${esc(t.title)}<div class="task-meta">🟢 ${esc(t.subject)}</div></div><span class="task-time">${esc(t.time||'Today')}</span><button class="cal-arrow" data-delete-id="${t.id}" title="Delete">×</button></div>`).join(''):'<p class="subtle">No tasks yet. Add your first study task above.</p>'}function renderCalendar(){let first=new Date(month.getFullYear(),month.getMonth(),1),last=new Date(month.getFullYear(),month.getMonth()+1,0),offset=(first.getDay()+6)%7;$('monthTitle').innerHTML=first.toLocaleDateString('en-IN',{month:'long'})+'<small>'+first.getFullYear()+'</small>';let html=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="weekday">${x}</div>`).join('');for(let i=0;i<offset;i++)html+='<div></div>';for(let i=1;i<=last.getDate();i++){let d=dateKey(new Date(month.getFullYear(),month.getMonth(),i)),has=state.tasks.some(t=>t.date===d);html+=`<button class="day ${d===today?'selected':''} ${has?'has-task':''}" data-date="${d}">${i}</button>`}$('calendar').innerHTML=html}function render(){renderSubjects();renderTasks();renderCalendar()}function addTask(){let title=$('taskInput').value.trim();if(!title)return;state.tasks.push({id:crypto.randomUUID(),title,subject:selectedSubject,date:today,done:false});$('taskInput').value='';save();render();toast('Task added')}function setPage(page){activePage=page;document.querySelectorAll('[data-page]').forEach(el=>el.classList.toggle('active',el.dataset.page===page));$('dashboard').classList.toggle('hidden',page!=='Dashboard');$('otherPage').classList.toggle('hidden',page==='Dashboard');$('sidebar').classList.remove('open');if(page==='Dashboard')return;$('otherTitle').textContent={List:'Study task list',Calendar:'Study calendar',Notes:'Notes & screenshots'}[page]||page;let html='';if(page==='List')html=`<div class="add-task"><input id="secondaryTask" placeholder="Add a study task"/><button id="secondaryAdd" class="primary">Add</button></div>${state.tasks.map(t=>`<div class="task"><span>${t.done?'✓':'○'}</span><div class="task-name">${esc(t.title)}<div class="task-meta">${esc(t.subject)} · ${t.date}</div></div></div>`).join('')||'<p>No tasks recorded yet.</p>'}`;if(page==='Calendar')html='<p class="subtle">Use the calendar on the Dashboard to see dates with study tasks. A full drag-and-drop calendar is planned for a later build.</p>';if(page==='Notes')html=`<label>Subject <select id="noteSubject" class="subject-picker">${state.subjects.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label><p><input id="noteTitle" class="search" placeholder="Note title" style="width:100%"></p><textarea id="noteBody" class="editor" placeholder="Write your lesson notes, formulas and doubts..."></textarea><p><button id="saveNote" class="primary">Save note</button></p><h2>Saved notes</h2>${state.notes.map(n=>`<div class="note"><strong>${esc(n.title)}</strong> <small>· ${esc(n.subject)} · ${new Date(n.created).toLocaleDateString()}</small><p>${esc(n.body).replace(/\n/g,'<br>')}</p></div>`).join('')||'<p class="subtle">No notes yet.</p>'}`;$('otherContent').innerHTML=html;if(page==='Notes')$('saveNote').onclick=()=>{let title=$('noteTitle').value.trim(),body=$('noteBody').value.trim();if(!title||!body)return toast('Enter a title and note');state.notes.unshift({id:crypto.randomUUID(),title,body,subject:$('noteSubject').value,created:Date.now()});save();setPage('Notes');toast('Note saved locally')};if(page==='List')$('secondaryAdd').onclick=()=>{$('taskInput').value=$('secondaryTask').value;addTask();setPage('List')}}function updateTimer(){let s=Math.max(0,timerRemaining);$('timerDisplay').textContent=`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;$('startTimer').textContent=timerRunning?'Ⅱ Pause':timerRemaining<timerMinutes*60?'▶ Resume':'▶ Start'}function tick(){if(!timerRunning)return;timerRemaining=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));updateTimer();if(timerRemaining===0){clearInterval(timerInterval);timerRunning=false;let mins=Math.round((Date.now()-timerStarted)/60000);$('timerStatus').textContent='Session finished';toast('Focus session complete!');if(confirm('Save this completed focus session?')){state.sessions.push({id:crypto.randomUUID(),subject:$('timerSubject').value,minutes:timerMinutes,date:today});save()}timerRemaining=timerMinutes*60;updateTimer()}}$('startTimer').onclick=()=>{if(timerRunning){timerRunning=false;clearInterval(timerInterval);$('timerStatus').textContent='Paused'}else{if(timerRemaining===timerMinutes*60)timerStarted=Date.now();timerEnd=Date.now()+timerRemaining*1000;timerRunning=true;timerInterval=setInterval(tick,250);$('timerStatus').textContent='Focus in progress'}updateTimer()};$('minusTime').onclick=()=>{if(timerRunning)return toast('Pause before changing duration');timerMinutes=Math.max(5,timerMinutes-5);timerRemaining=timerMinutes*60;updateTimer()};$('plusTime').onclick=()=>{if(timerRunning)return toast('Pause before changing duration');timerMinutes=Math.min(180,timerMinutes+5);timerRemaining=timerMinutes*60;updateTimer()};$('addTaskBtn').onclick=addTask;$('taskInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});$('taskList').onclick=e=>{let del=e.target.closest('[data-delete-id]');if(del){state.tasks=state.tasks.filter(t=>t.id!==del.dataset.deleteId);save();render()}};$('taskList').onchange=e=>{if(e.target.dataset.taskId){let t=state.tasks.find(t=>t.id===e.target.dataset.taskId);if(t)t.done=e.target.checked;save();render()}};document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>{selectedSubject=b.dataset.subject;document.querySelectorAll('[data-subject]').forEach(x=>x.classList.toggle('selected',x===b));renderSubjects()});$('navigation').onclick=e=>{let b=e.target.closest('[data-page]');if(b)setPage(b.dataset.page)};$('prevMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);renderCalendar()};$('nextMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);renderCalendar()};$('calendar').onclick=e=>{let b=e.target.closest('[data-date]');if(b)toast('Selected '+b.dataset.date)};$('menuBtn').onclick=()=>$('sidebar').classList.toggle('open');$('clockBtn').onclick=()=>{setPage('Dashboard');document.querySelector('.timer').scrollIntoView({behavior:'smooth'})};$('notifyBtn').onclick=()=>toast(state.tasks.filter(t=>t.date===today&&!t.done).length+' study tasks remaining today');$('addSubject').onclick=()=>{let s=prompt('New subject name');if(s&&s.trim()&&!state.subjects.includes(s.trim())){state.subjects.push(s.trim());save();render()}};$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='rbi-prep-os-backup.json';a.click();URL.revokeObjectURL(url);toast('Backup exported')};$('settingsBtn').onclick=()=>toast('Use Export summary to back up your local study data');$('search').addEventListener('input',e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('.task').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'':'none')});let hr=new Date().getHours();$('greeting').textContent=(hr<12?'Good Morning':hr<17?'Good Afternoon':'Good Evening')+'! 👋';render();updateTimer();
</script></body></html>
